name: CI

on:
  push:
    branches: [main]
  pull_request:

# Read-only token: the workflow only checks out and tests.
permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:18-alpine
        env:
          POSTGRES_DB: testing
          POSTGRES_USER: sail
          POSTGRES_PASSWORD: password
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      DB_HOST: 127.0.0.1

    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5

      - uses: shivammathur/setup-php@eb7c497e18156a6bbabfef1d3a82760b9eda3962 # v2
        with:
          php-version: '8.4'
          extensions: intl, pdo_pgsql
          coverage: pcov

      - run: composer install --no-interaction --prefer-dist --no-progress

      - run: composer audit

      - run: cp .env.example .env && php artisan key:generate

      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: 24
          cache: npm

      - run: npm ci && npm run build

      - run: npm audit --audit-level=high

      - run: composer check

      # Line coverage is about 94 %; the build fails if it drops below 90 %.
      - name: Coverage
        run: php artisan test --coverage --min=90
